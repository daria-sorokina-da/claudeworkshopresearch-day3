<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Royal Stables — Yard Board</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="board-header">
  <h1>Royal Stables — Yard Board</h1>
  <p class="board-subtitle">Static demo. No backend. Deliberately repetitive.</p>
</header>

<main>
  <section class="panel">
    <h2>Stables</h2>
    <div class="stable-grid">
      <div class="stable-card" id="card-northgate">
        <h3 class="stable-card-title">Northgate</h3>
        <p class="stable-card-county">Norfolk</p>
        <p class="stable-card-count" id="count-northgate">–</p>
        <button class="stable-card-button" id="btn-northgate">Show horses</button>
        <ul class="stable-card-list" id="list-northgate"></ul>
      </div>
      <div class="stable-card" id="card-willowmere">
        <h3 class="stable-card-title">Willowmere</h3>
        <p class="stable-card-county">Suffolk</p>
        <p class="stable-card-count" id="count-willowmere">–</p>
        <button class="stable-card-button" id="btn-willowmere">Show horses</button>
        <ul class="stable-card-list" id="list-willowmere"></ul>
      </div>
      <div class="stable-card" id="card-ashcombe">
        <h3 class="stable-card-title">Ashcombe</h3>
        <p class="stable-card-county">Norfolk</p>
        <p class="stable-card-count" id="count-ashcombe">–</p>
        <button class="stable-card-button" id="btn-ashcombe">Show horses</button>
        <ul class="stable-card-list" id="list-ashcombe"></ul>
      </div>
      <div class="stable-card" id="card-fairwater">
        <h3 class="stable-card-title">Fairwater</h3>
        <p class="stable-card-county">Cambridgeshire</p>
        <p class="stable-card-count" id="count-fairwater">–</p>
        <button class="stable-card-button" id="btn-fairwater">Show horses</button>
        <ul class="stable-card-list" id="list-fairwater"></ul>
      </div>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
